name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする（実行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: テスト
        run: node tests/run.mjs

      - name: 画面のテスト用にブラウザを用意する
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: 画面のテスト
        run: node tests/e2e.mjs

      - name: 公開するファイルだけをまとめる
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons vendor models texts .nojekyll _site/

      - name: Service Worker にキャッシュ対象とビルドIDを埋め込む
        run: node scripts/build-sw.mjs _site "${GITHUB_SHA::12}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
